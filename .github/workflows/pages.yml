name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - uat

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The same command is enforced locally by the Husky pre-commit hook.
      - name: Pre-deploy verification
        run: npm run verify

      - name: Generate build info
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "$COMMIT")
          cat > build-info.json <<EOF
          {"version":"${VERSION}","commit":"${COMMIT}","branch":"${BRANCH}","buildDate":"${BUILD_DATE}"}
          EOF

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: .
          keep_files: true
          exclude_assets: '.github,node_modules,tests,playwright-report,test-results'

      - name: Deploy UAT
        if: github.ref == 'refs/heads/uat'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: uat
          keep_files: true
          exclude_assets: '.github,node_modules,tests,playwright-report,test-results'

      - name: Smoke-test deployed UAT
        if: github.ref == 'refs/heads/uat'
        run: npm run test:uat
        env:
          UAT_BASE_URL: https://rickliky.github.io/table-tennis/uat/
          WORKER_BASE_URL: https://little-kings-api.little-kings.workers.dev
          EXPECTED_COMMIT: ${{ github.sha }}
