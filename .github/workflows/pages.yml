name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - uat

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate build info
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "$COMMIT")
          cat > build-info.json <<EOF
          {"version":"${VERSION}","commit":"${COMMIT}","branch":"${BRANCH}","buildDate":"${BUILD_DATE}"}
          EOF
          # The source file is ignored locally, but the published copy must be tracked.
          sed -i '/^build-info\.json$/d' .gitignore

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: .
          keep_files: true

      - name: Deploy UAT
        if: github.ref == 'refs/heads/uat'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: uat
          keep_files: true
