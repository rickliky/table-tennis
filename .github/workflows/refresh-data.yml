name: Build public data snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build public data from repository sources
        run: |
          node scripts/build-public-data.js
      - name: Verify cached data
        run: |
          jq -e '.ok == true and (.players | type == "array") and (.matches | type == "array") and all(.matches[]; .matchDate and .player1Id and .player2Id)' public-data.json > /dev/null
      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- public-data.json; then exit 0; fi
          git config user.name "little-kings-data-bot"
          git config user.email "actions@github.com"
          git add public-data.json
          git commit -m "Build public club data"
          git push
