name: Refresh public data snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch approved public sheet data
        run: |
          curl --fail --show-error --location --connect-timeout 20 --max-time 90 --retry 5 --retry-all-errors --retry-delay 3 "https://script.google.com/macros/s/AKfycbx6IaN9YT2a4bv_8W76qtNwkFCjZ_-mODBEMTK9IiJlSi91UCIgJ56MQ4WJqeKK3TiUvA/exec?action=publicData" --output new-public-data.json
          curl --fail --show-error --location --connect-timeout 20 --max-time 90 --retry 5 --retry-all-errors --retry-delay 3 "https://script.google.com/macros/s/AKfycbx6IaN9YT2a4bv_8W76qtNwkFCjZ_-mODBEMTK9IiJlSi91UCIgJ56MQ4WJqeKK3TiUvA/exec?action=profileSupplements" --output new-player-profile-supplements.json
      - name: Verify cached data
        run: |
          jq -e '.ok == true and (.players | type == "array") and (.matches | type == "array") and all(.matches[]; .matchDate and .player1Id and .player2Id)' new-public-data.json > /dev/null
          jq -e '.ok == true and (.entries | type == "array")' new-player-profile-supplements.json > /dev/null
      - name: Commit only when cached data changed
        run: |
          changed=false
          if ! { [ -f public-data.json ] && diff -q <(jq -S 'del(.lastUpdated)' public-data.json) <(jq -S 'del(.lastUpdated)' new-public-data.json); }; then
            mv new-public-data.json public-data.json
            changed=true
          fi
          if ! { [ -f player-profile-supplements.json ] && diff -q <(jq -S . player-profile-supplements.json) <(jq -S . new-player-profile-supplements.json); }; then
            mv new-player-profile-supplements.json player-profile-supplements.json
            changed=true
          fi
          if [ "$changed" = false ]; then exit 0; fi
          git config user.name "little-kings-data-bot"
          git config user.email "actions@github.com"
          git add public-data.json player-profile-supplements.json
          git commit -m "Refresh public club data"
          git push
